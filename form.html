<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
    <meta name="Author" content="Tomás Suárez">
    <meta name="description" content="This page allows the user to send a review about an specific Product">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <h1>Product Review</h1>
        </nav>
    </header>
    <main>
        <form method="get" action="review.html" class="review-form">
            <div class="form-item">
                <label for="product-name">Product Name <span class="required">*</span></label>
                    <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-group">

                    <label for="star1">
                        ☆
                        <input type="radio" id="star1" name="rating" value="1" required>
                    </label>
                    <label for="star2">
                        ☆☆
                        <input type="radio" id="star2" name="rating" value="2" required>
                    </label>
                    <label for="star3">
                        ☆☆☆
                        <input type="radio" id="star3" name="rating" value="3" required>
                    </label>
                    <label for="star4">
                        ☆☆☆☆
                        <input type="radio" id="star4" name="rating" value="4" required>
                    </label>
                    <label for="star5">
                        ☆☆☆☆☆
                        <input type="radio" id="star5" name="rating" value="5" required> 
                    </label>
                </div>
            </fieldset>

            <div class="form-item">
                <label for="install-date">Date of Installation<span class="required">*</span></label>
                <input type="date" id="install-date" name="install-date" required>
            </div>
            <fieldset class="form-item">
                <legend>Which features did you find useful?(Check all that apply)</legend>
                <label for="feature-durability">
                    <input type="checkbox" name="features" id="feature-durability" value="durability">
                    Durability
                </label>
                <label for="feature-ease">
                    <input type="checkbox" name="features" id="feature-ease" value="ease-of-use">
                    Ease of Use
                </label>
                <label for="feature-performance">
                    <input type="checkbox" name="features" id="feature-performance" value="performance">
                    Performance
                </label>
                <label for="feature-design">
                    <input type="checkbox" name="features" id="feature-design" value="design">
                    Design
                </label>
            </fieldset>
            <div class="form-item">
                <label for="review">
                    Written Review (optional)</label>
                    <textarea name="review" id="review" rows="4" placeholder="Write your thoughts about the product"></textarea>
                
            </div>
            <div class="form-item">
                <label for="user-name">
                    Your Name (optional)
                </label>
                <input type="text" name="user-name" id="user-name" placeholder="Enter your name">
            </div>
            <div class="form-item">
                <input type="submit" value="Post Review" class="submit-button">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Tomas | WDD 131</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
